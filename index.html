<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body >
  <div class="container mt-5">
    <h1 class="text-center">Student Management System</h1>
  </div>
  <div class="container mt-4">
    <div class="row">
      <div class="col-md-6">
        <h2>Add Student</h2>
        <form id="addStudentForm">
          <div class="mb-3">
            <label for="studentName" class="form-label">Name</label>
            <input type="text" class="form-control" id="studentName" >
          </div>
          <div class="mb-3">
            <label for="studentAge" class="form-label">Age</label>
            <input type="number" class="form-control" id="studentAge" >
          </div>
          <div class="mb-3">
            <label for="studentGrade" class="form-label">Grade</label>
            <input type="text" class="form-control" id="studentGrade" >
          </div>
          <button type="submit" class="btn btn-primary" onclick="addStudent()">Add Student</button>
        </form>
      </div>
      <div class="col-md-6">
        <h2 class="text-center">Student List</h2>
        <table class="table mt-3">
          <thead>
            <tr>
              <th class="border border-dark">Name</th>
              <th class="border border-dark">Age</th>
              <th class="border border-dark">Grade</th>
              <th class="border border-dark">Tools</th>
            </tr>
          </thead>
          <tbody id="studentList">
          </tbody>
        </table>
      </div>
    </div>
  </div>
 <script>
  let students = JSON.parse(localStorage.getItem("students")) || [];
  function addStudent() {
    let name=document.getElementById("studentName").value;
    let age=document.getElementById("studentAge").value;
    let grade=document.getElementById("studentGrade").value;

    let stu = {
      name: name,
      age: age,
      grade: grade
    };

    students.push(stu);
    localStorage.setItem("students", JSON.stringify(students));
    displayStudents();
    document.getElementById("addStudentForm").reset();
  }

  function displayStudents() {
    let list=document.getElementById("studentList");

    list.innerHTML="";

    for (let i=0;i<students.length;i++) {
      list.innerHTML +=`
        <tr>
          <td  class="border border-dark">${students[i].name}</td>
          <td class="border border-dark">${students[i].age}</td>
          <td class="border border-dark">${students[i].grade}</td>
          <td class="border border-dark">
            <button class="btn btn-danger me-2" onclick="deleteStudent()">Delete</button>
            <button class="btn btn-warning" onclick="editStudent()">Edit</button>
          </td>
        </tr>
      `;
    }
  }

  displayStudents();
</script>

</body>
</html>
