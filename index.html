<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Student Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center">Student Management System</h1>
    </div>

    <div class="container mt-4">
        <div class="row">
           <div class="col-md-6">
              <h2>Add Student</h2>
              <form id="addStudentForm">
               <div class="mb-3">
                <label for="studentId" class="form-label">Student ID</label>
                <input type="text" class="form-control" id="studentId" required>
                </div>
                <div class="mb-3">
                  <label for="studentName" class="form-label">Name</label>
                  <input type="text" class="form-control" id="studentName" required>
                  </div>
                   <div class="mb-3">
                        <div class="form-field">
                           <label for="fieldSelect" class="form-label">Course</label>
                             <select class="form-control" id="studentCourse" required>
                              <option value="" selected disabled>Choose Course</option>
                              <option value="MERN">MERN</option>
                              <option value="Data Science">Data Science</option>
                              <option value="Python">Python</option>
                              <option value="Data Analytics">Data Analytics</option>
                              <option value="Machine Learning">Machine Learning</option>
                            </select>
                         </div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        Add Student
                    </button>
                </form>
            </div>

            <div class="col-md-6">
                <h2 class="text-center">Student List</h2>

                <table class="table table-bordered mt-3">
                    <thead>
                        <tr>
                            <th class="border border-dark">Student ID</th>
                            <th class="border border-dark">Name</th>
                            <th class="border border-dark">Course</th>
                            <th class="border border-dark">Tools</th>
                        </tr>
                    </thead>

                    <tbody id="studentList"></tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        let students = JSON.parse(localStorage.getItem("students")) || [];
        let editId = null;

        const form = document.getElementById("addStudentForm");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            let id = document.getElementById("studentId").value.trim();
            let name = document.getElementById("studentName").value.trim();
            let course = document.getElementById("studentCourse").value.trim();

            if (!id || !name || !course) {
                alert("Please fill all fields");
                return;
            }

            if (editId === null && students.some(student => student.id === id)) {
                alert("Student ID already exists!");
                return;
            }

            if (editId !== null) {
                let student = students.find(student => student.id === editId);

                if (student) {

                    if (id !== editId && students.some(student => student.id === id)) {
                        alert("Student ID already exists!");
                        return;
                    }

                    student.id = id;
                    student.name = name;
                    student.course = course;
                    
                }
            } else {
                students.push({
                    id: id,
                    name: name,
                    course: course,
                    
                });
            }

            localStorage.setItem("students", JSON.stringify(students));

            form.reset();
            editId = null;
            document.getElementById("submitBtn").textContent = "Add Student";

            displayStudents();
        });

        function displayStudents() {
            let list = document.getElementById("studentList");
            list.innerHTML = "";

            students.sort((a, b) => (a.id || 0) - (b.id || 0));

            students.forEach(student => {
                list.innerHTML += `
                    <tr>
                        <td class="border border-dark">${student.id}</td>
                        <td class="border border-dark">${student.name}</td>
                        <td class="border border-dark">${student.course}</td>
                        <td class="border border-dark">
                            <button class="btn btn-warning btn-sm me-1"
                                onclick="editStudent('${student.id}')">
                                Edit
                            </button>

                            <button class="btn btn-danger btn-sm"
                                onclick="deleteStudent('${student.id}')">
                                Delete
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        function editStudent(id) {
            let student = students.find(student => student.id === id);

            if (!student) return;

            editId = student.id;

            document.getElementById("studentId").value = student.id;
            document.getElementById("studentName").value = student.name;
            document.getElementById("studentCourse").value = student.course;

            document.getElementById("submitBtn").textContent = "Update Student";
        }

        function deleteStudent(id) {
            if (!confirm("Are you sure you want to delete this student?")) {
                return;
            }

            students = students.filter(student => student.id !== id);

            localStorage.setItem("students", JSON.stringify(students));

            if (editId === id) {
                editId = null;
                form.reset();
                document.getElementById("submitBtn").textContent = "Add Student";
            }

            displayStudents();
        }

        displayStudents();
    </script>
</body>
</html>
